<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Trackia"><title>Trackia</title><style>.sweep{transform-origin:20px 20px;animation:trk-spin 3.2s linear infinite}.ping{transform-box:fill-box;transform-origin:center;animation:trk-ping 3.2s ease-out infinite}.blip{animation:trk-blip 3.2s linear infinite}@keyframes trk-spin{to{transform:rotate(360deg)}}@keyframes trk-ping{0%{transform:scale(.6);opacity:.7}45%,100%{transform:scale(2.4);opacity:0}}@keyframes trk-blip{0%{opacity:1}70%,100%{opacity:.35}}@media (prefers-reduced-motion:reduce){.sweep,.ping,.blip{animation:none}.ping{opacity:0}}</style><defs><linearGradient id="trk-d" x1="20.9" y1="3" x2="33.6" y2="9.8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5b9eff" stop-opacity="0"/><stop offset="1" stop-color="#5b9eff" stop-opacity="0.55"/></linearGradient></defs><g class="sweep"><path d="M20 20 L20.89 3.02 A17 17 0 0 1 33.58 9.77 Z" fill="url(#trk-d)"/><line x1="20" y1="20" x2="33.58" y2="9.77" stroke="#5b9eff" stroke-width="1.5" stroke-linecap="round"/></g><circle cx="20" cy="20" r="17" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="82.8 24" stroke-dashoffset="-1" stroke-linecap="round"/><circle cx="20" cy="20" r="9.5" fill="none" stroke="#ffffff" stroke-width="3"/><circle cx="20" cy="20" r="1.8" fill="#ffffff"/><circle class="ping" cx="33.58" cy="9.77" r="3" fill="#5b9eff"/><circle class="blip" cx="33.58" cy="9.77" r="3" fill="#5b9eff"/></svg>
